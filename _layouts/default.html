<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="{{ site.theme_mode | default: 'dark' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="{{ site.accent | default: '#E8A838' }}">
  <meta name="color-scheme" content="dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  {% seo %}
  {% feed_meta %}

  <style>
    :root { --accent: {{ site.accent | default: '#E8A838' }}; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere-grid"></div>
    <div class="atmosphere-scan"></div>
    <div class="atmosphere-vignette"></div>
  </div>

  {% include header.html %}

  <main class="main-content" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
